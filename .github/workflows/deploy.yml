name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Renamed from EC2_* — this now targets a Hetzner VPS, not AWS EC2.
      # The SSH mechanism itself doesn't care what's on the other end, so no
      # other change was needed here beyond the secret names. You need to
      # add these secret names (DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY,
      # DEPLOY_SSH_PORT, DEPLOY_APP_DIR) in this repo's GitHub Settings →
      # Secrets → Actions — I can't create or read repo secrets myself.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script_stop: true
          script: |
            cd ${{ secrets.DEPLOY_APP_DIR }}
            # `sudo` (no -E) runs these two as root, with root's own $HOME —
            # so they pick up root's ~/.ssh, not this SSH login user's. Only
            # needed if this login user has no GitHub key/deploy-key of its
            # own registered but root does. Requires passwordless sudo for
            # this user on git specifically (visudo: `<user> ALL=(root)
            # NOPASSWD: /usr/bin/git`) — there's no TTY here to type a
            # password into.
            sudo git fetch origin main
            sudo git reset --hard origin/main
            # The two commands above just wrote every file as root — hand
            # the checkout back to this login user before deploy.sh runs,
            # or its own writes (releases/, etc.) and the next run's plain
            # `git fetch` hit the same "dubious ownership"/permission
            # problem all over again.
            sudo chown -R "$(whoami):$(whoami)" ${{ secrets.DEPLOY_APP_DIR }}
            ./scripts/deploy.sh
