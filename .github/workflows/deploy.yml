name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Isolated unit tests (mocked providers, no real infra). Coverage
      # threshold (80% statements/branches/functions/lines) is enforced by
      # the jest config in package.json — this step fails the build if it
      # regresses below that.
      - name: Unit tests
        run: pnpm test:cov

      # Real Postgres + Redis via testcontainers (ubuntu-latest runners have
      # a Docker daemon available by default, no service-container setup
      # needed) and mocked outbound HTTP (Meta Graph API / Channex) so no
      # real external calls happen in CI.
      - name: E2E tests
        run: pnpm test:e2e

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Renamed from EC2_* — this now targets a Hetzner VPS, not AWS EC2.
      # The SSH mechanism itself doesn't care what's on the other end, so no
      # other change was needed here beyond the secret names. You need to
      # add these secret names (DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY,
      # DEPLOY_SSH_PORT, DEPLOY_APP_DIR) in this repo's GitHub Settings →
      # Secrets → Actions — I can't create or read repo secrets myself.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script_stop: true
          script: |
            cd ${{ secrets.DEPLOY_APP_DIR }}
            git fetch origin main
            git reset --hard origin/main
            ./scripts/deploy.sh
