services:
  postgres:
    # Local dev only — production uses Neon (see app_blue/app_green's env_file
    # .env, DB_HOST/DB_SSL point at Neon there). Gated behind its own profile
    # so a bare `docker compose up -d` on the production host (no explicit
    # service names) can never start it by accident — deploy.sh never does
    # that (it always names services explicitly), but a human running compose
    # commands by hand on the VPS might.
    profiles: ['local']
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-wa_poc}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10

  maildev:
    image: maildev/maildev:2.1.0
    restart: unless-stopped
    ports:
      - '1080:1080'
      - '1025:1025'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  loki:
    image: grafana/loki:3.0.0
    restart: unless-stopped
    profiles: ['production']
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    profiles: ['production']
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_SMTP_ENABLED: 'true'
      GF_SMTP_HOST: '${GRAFANA_SMTP_HOST:-maildev}:${GRAFANA_SMTP_PORT:-1025}'
      GF_SMTP_USER: ${SMTP_USER:-}
      GF_SMTP_PASSWORD: ${SMTP_PASS:-}
      GF_SMTP_SKIP_VERIFY: 'true'
      GF_SMTP_FROM_ADDRESS: grafana-alerts@wa-poc.local
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
      - maildev

  app_blue: &app_base
    profiles: ['production']
    image: node:22-alpine
    working_dir: /releases/${RELEASE_SHA:-current}
    command: node dist/main.js
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOKI_HOST: http://loki:3100
      NODE_ENV: production
      RELEASE_SHA: ${RELEASE_SHA:-current}
    volumes:
      - ${RELEASES_DIR:-./releases}:/releases:ro
    ports:
      # Bound to localhost only — nginx runs on this same host and reaches
      # these directly; nothing outside the box should ever hit them.
      - '127.0.0.1:${APP_PORT_BLUE:-3002}:3002'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      loki:
        condition: service_started

  app_green:
    <<: *app_base
    ports:
      - '127.0.0.1:${APP_PORT_GREEN:-3003}:3002'

volumes:
  postgres_data:
  redis_data:
  loki_data:
  grafana_data:
