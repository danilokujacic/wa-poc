services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-wa_poc}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10

  maildev:
    image: maildev/maildev:2.1.0
    restart: unless-stopped
    ports:
      - '1080:1080'
      - '1025:1025'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  loki:
    image: grafana/loki:3.0.0
    restart: unless-stopped
    profiles: ['production']
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    profiles: ['production']
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: wa-poc-app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOKI_HOST: http://loki:3100
      NODE_ENV: production
    # No host port published here on purpose: --scale app=2 (see deploy.sh)
    # runs two containers of this service at once during a cutover, and two
    # containers can't both bind the same host port. `proxy` is what's
    # actually reachable from outside; it load-balances across whatever
    # `app` replicas are currently running, resolved fresh per-request via
    # Docker's internal DNS (see Caddyfile) so a freshly started replica is
    # picked up without a proxy restart.
    expose:
      - '3002'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      loki:
        condition: service_started

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:80'
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddyfile:ro
    command: caddy run --config /etc/caddyfile --adapter caddyfile
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  loki_data:
  grafana_data:
