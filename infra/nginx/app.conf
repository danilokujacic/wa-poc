# Reference nginx config for the Hetzner host — NOT used by docker-compose
# (nginx lives on the host, not in a container here). Install this yourself
# on the VPS, e.g. as /etc/nginx/sites-available/wa-poc.conf, symlink into
# sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# Why it's shaped this way: app_blue/app_green in docker-compose.yml are two
# permanently-running instances on fixed host ports 3002/3003 (see the notes
# there and in deploy.sh). Plain open-source nginx has no active health
# checks (that's an nginx-plus feature) and caches its upstream list at
# startup/reload — it will NOT auto-discover a container coming and going the
# way Caddy did. Instead this relies on:
#   - max_fails/fail_timeout: passive failure detection — a few failed
#     connection attempts to one upstream marks it "down" for fail_timeout
#     seconds, during which nginx stops trying it.
#   - proxy_next_upstream: retries a failed request against the OTHER
#     upstream within the same client request, so a request that happens to
#     land on the one being restarted doesn't fail visibly at all.
# Because both ports are always listed here, this config never needs to
# change or reload as part of a normal deploy — only if the ports themselves
# ever change.
upstream wa_poc_app {
    server 127.0.0.1:3002 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:3003 max_fails=1 fail_timeout=5s;
}

server {
    listen 80;
    server_name your-domain.example.com; # TODO: replace with the real domain

    location / {
        proxy_pass http://wa_poc_app;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2; # exactly the two upstreams above
        proxy_connect_timeout 2s;    # fail fast onto the other upstream

        # Required for the desk's socket.io connection to actually upgrade
        # to a real websocket through nginx instead of silently falling back
        # to (slower, more fragile) long-polling.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# TLS: once you're pointing a real domain at this host, the simplest path is
# `certbot --nginx` — it edits this file in place to add the certificate
# paths and an HTTP->HTTPS redirect. Not pre-written here since it depends on
# the actual domain and certbot's own generated block structure.
